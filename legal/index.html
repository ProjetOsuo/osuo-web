<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Textes légaux · Osuo</title>
<style>
:root { --bg: #f6f5fb; --card: #ffffff; --text: #1d1b2c; --muted: #5f5b73;
  --line: #e6e3f0; --primary: #8566ff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #14131c; --card: #1d1b28; --text: #f1effa; --muted: #b4afc8;
    --line: #2e2b3d; --primary: #a08bff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
nav { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px;
  font-size: 14px; }
nav a { color: var(--primary); text-decoration: none; font-weight: 600; }
article { background: var(--card); border-radius: 12px; padding: 20px 16px; }
h1 { font-size: 26px; line-height: 1.25; margin: 0 0 8px; }
h2 { font-size: 19px; margin: 28px 0 8px; }
p, li { color: var(--text); }
a { color: var(--primary); overflow-wrap: anywhere; }
ul { padding-left: 20px; }
.table { overflow-x: auto; margin: 12px 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px;
  border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; }
footer { color: var(--muted); font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<main>
<nav><a href="confidentialite/">Politique de confidentialité</a> <a href="cgu/">Conditions d&#x27;utilisation</a> <a href="mentions/">Mentions légales</a></nav>
<article>
<h1>Osuo : textes légaux</h1><ul><li><a href="confidentialite/">Politique de confidentialité</a></li><li><a href="cgu/">Conditions d&#x27;utilisation</a></li><li><a href="mentions/">Mentions légales</a></li></ul>
</article>
<footer>Osuo · contact : <a href="mailto:contact.osuo@gmail.com">contact.osuo@gmail.com</a></footer>
</main>
</body>
</html>
